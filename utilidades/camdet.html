<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detector de Rostros</title>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #25324d, #0b1020 65%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .app {
      width: min(100%, 900px);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 5vw, 42px);
    }

    p {
      margin: 0 0 18px;
      opacity: 0.8;
    }

    .videoBox {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 22px;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    video,
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    canvas {
      pointer-events: none;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 13px 18px;
      font-weight: 700;
      cursor: pointer;
      color: #101828;
      background: linear-gradient(135deg, #8ee7ff, #b9ffcf);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.14);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .status {
      margin-top: 14px;
      font-size: 18px;
      font-weight: 700;
      color: #b9ffcf;
    }

    .hint {
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.65;
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>Detector de rostros en tiempo real</h1>
    <p>Activa la cámara y el sistema marcará los rostros detectados.</p>

    <section class="videoBox">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="canvas"></canvas>
    </section>

    <div class="actions">
      <button id="btnStart">Iniciar cámara</button>
      <button id="btnStop" class="secondary">Detener</button>
    </div>

    <div id="status" class="status">Listo para iniciar.</div>
    <div class="hint">
      Importante: para usar cámara, abrilo en localhost o publicado con HTTPS.
    </div>
  </main>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const statusText = document.getElementById("status");
    const btnStart = document.getElementById("btnStart");
    const btnStop = document.getElementById("btnStop");

    let stream = null;
    let intervalId = null;
    let ultimosRostros = [];

    let margenArribaValor = 0.400;
    let margenAbajoValor = 0.10;
    let margenCostadosValor = 0.10;

    let camaraActual = "user";

    const btnGuardar = document.createElement("button");
    btnGuardar.textContent = "Guardar rostro como PNG";
    btnGuardar.className = "secondary";
    btnGuardar.style.display = "none";
    document.querySelector(".actions").appendChild(btnGuardar);


    const btnCambiarCamara = document.createElement("button");
    btnCambiarCamara.textContent = "Cambiar cámara";
    btnCambiarCamara.className = "secondary";
    document.querySelector(".actions").appendChild(btnCambiarCamara);


    const inputArriba = document.createElement("input");
    inputArriba.type = "text";
    inputArriba.placeholder = "Arriba";
    inputArriba.value = "400";
    inputArriba.inputMode = "numeric";
    inputArriba.pattern = "[0-9]*";
    inputArriba.maxLength = 3;
    inputArriba.oninput = () => {
      inputArriba.value = inputArriba.value.replace(/\D/g, "");
    };

    const inputAbajo = document.createElement("input");
    inputAbajo.type = "text";
    inputAbajo.placeholder = "Abajo";
    inputAbajo.value = "10";
    inputAbajo.inputMode = "numeric";
    inputAbajo.pattern = "[0-9]*";
    inputAbajo.maxLength = 3;
    inputAbajo.oninput = () => {
      inputAbajo.value = inputAbajo.value.replace(/\D/g, "");
    };

    const inputCostados = document.createElement("input");
    inputCostados.type = "text";
    inputCostados.placeholder = "Costados";
    inputCostados.value = "10";
    inputCostados.inputMode = "numeric";
    inputCostados.pattern = "[0-9]*";
    inputCostados.maxLength = 3;
    inputCostados.oninput = () => {
      inputCostados.value = inputCostados.value.replace(/\D/g, "");
    };

    [inputArriba, inputAbajo, inputCostados].forEach(input => {
      input.style.width = "90px";
      input.style.height = "44px";
      input.style.borderRadius = "12px";
      input.style.border = "1px solid rgba(255,255,255,0.15)";
      input.style.background = "rgba(255,255,255,0.08)";
      input.style.color = "white";
      input.style.padding = "0 12px";
      input.style.fontSize = "15px";
      input.style.outline = "none";
    });

    const btnSetear = document.createElement("button");
    btnSetear.textContent = "Setear";

    btnSetear.addEventListener("click", () => {

      const arriba = Number(inputArriba.value || 0);
      const abajo = Number(inputAbajo.value || 0);
      const costados = Number(inputCostados.value || 0);

      margenArribaValor = arriba / 1000;
      margenAbajoValor = abajo / 100;
      margenCostadosValor = costados / 100;

      statusText.textContent =
        `Márgenes actualizados → Arriba ${margenArribaValor.toFixed(3)} | ` +
        `Abajo ${margenAbajoValor.toFixed(2)} | ` +
        `Costados ${margenCostadosValor.toFixed(2)}`;
    });

    document.querySelector(".actions").appendChild(inputArriba);
    document.querySelector(".actions").appendChild(inputAbajo);
    document.querySelector(".actions").appendChild(inputCostados);
    document.querySelector(".actions").appendChild(btnSetear);


    function dosDigitos(n) {
      return String(n).padStart(2, "0");
    }

    function fechaHoraNombre() {
      const d = new Date();

      const fecha =
        dosDigitos(d.getDate()) +
        dosDigitos(d.getMonth() + 1) +
        d.getFullYear();

      const hora =
        dosDigitos(d.getHours()) +
        dosDigitos(d.getMinutes()) +
        dosDigitos(d.getSeconds());

      return `${fecha}_${hora}`;
    }

    async function cargarModelo() {
      statusText.textContent = "Cargando modelo de detección...";
      await faceapi.nets.tinyFaceDetector.loadFromUri(
        "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/"
      );
      statusText.textContent = "Modelo cargado.";
    }

    async function iniciarCamara() {
      try {
        await cargarModelo();

        // stream = await navigator.mediaDevices.getUserMedia({
        //   video: { facingMode: "user" },
        //   audio: false
        // });

        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: camaraActual },
          audio: false
        });

        video.srcObject = stream;

        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          detectarRostros();
        };
      } catch (error) {
        console.error(error);
        statusText.textContent = "No se pudo acceder a la cámara.";
      }
    }

    function detectarRostros() {
      const ctx = canvas.getContext("2d");

      intervalId = setInterval(async () => {
        if (video.paused || video.ended) return;

        const detections = await faceapi.detectAllFaces(
          video,
          new faceapi.TinyFaceDetectorOptions({
            inputSize: 320,
            scoreThreshold: 0.5
          })
        );

        const displaySize = {
          width: video.videoWidth,
          height: video.videoHeight
        };

        const resized = faceapi.resizeResults(detections, displaySize);
        //ultimosRostros = resized.map(det => det.box);

        ultimosRostros = resized.map(det => ampliarCajaRostro(det.box));

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // resized.forEach(det => {
        //   const box = det.box;

        //   ctx.strokeStyle = "#00ff88";
        //   ctx.lineWidth = 4;
        //   ctx.strokeRect(box.x, box.y, box.width, box.height);

        //   ctx.fillStyle = "rgba(0, 255, 136, 0.9)";
        //   ctx.font = "20px Arial";
        //   ctx.fillText("Rostro", box.x, Math.max(box.y - 8, 22));
        // });

        ultimosRostros.forEach(box => {
          ctx.strokeStyle = "#00ff88";
          ctx.lineWidth = 4;
          ctx.strokeRect(box.x, box.y, box.width, box.height);

          ctx.fillStyle = "rgba(0, 255, 136, 0.9)";
          ctx.font = "20px Arial";
          //ctx.fillText("Rostro ampliado", box.x, Math.max(box.y - 8, 22));
          ctx.fillText("Rostro detectado", box.x, Math.max(box.y - 8, 22));
        });

        if (resized.length > 0) {
          btnGuardar.style.display = "inline-block";
        } else {
          btnGuardar.style.display = "none";
        }

        statusText.textContent =
          resized.length === 1
            ? "1 rostro detectado"
            : `${resized.length} rostros detectados`;
      }, 120);
    }

    // function ampliarCajaRostro(box) {
    //   const margenArriba = box.height * 0.350;
    //   const margenAbajo = box.height * 0.10;
    //   const margenCostados = box.width * 0.10;



    //   // Por ejemplo, si querés más cabeza:
    //   // const margenArriba = box.height * 0.60;

    //   // Si querés más cuello:
    //   // const margenAbajo = box.height * 0.40;



    //   const x = Math.max(0, Math.round(box.x - margenCostados));
    //   const y = Math.max(0, Math.round(box.y - margenArriba));

    //   const derecha = Math.min(
    //     video.videoWidth,
    //     Math.round(box.x + box.width + margenCostados)
    //   );

    //   const abajo = Math.min(
    //     video.videoHeight,
    //     Math.round(box.y + box.height + margenAbajo)
    //   );

    //   return {
    //     x,
    //     y,
    //     width: derecha - x,
    //     height: abajo - y
    //   };
    // }

    function ampliarCajaRostro(box) {

      const margenArriba = box.height * margenArribaValor;
      const margenAbajo = box.height * margenAbajoValor;
      const margenCostados = box.width * margenCostadosValor;

      const x = Math.max(0, Math.round(box.x - margenCostados));
      const y = Math.max(0, Math.round(box.y - margenArriba));

      const derecha = Math.min(
        video.videoWidth,
        Math.round(box.x + box.width + margenCostados)
      );

      const abajo = Math.min(
        video.videoHeight,
        Math.round(box.y + box.height + margenAbajo)
      );

      return {
        x,
        y,
        width: derecha - x,
        height: abajo - y
      };
    }

    function descargarRostrosComoPNG() {
      if (!ultimosRostros.length) {
        statusText.textContent = "No hay rostros para guardar.";
        return;
      }

      const nombreBase = fechaHoraNombre();

      // ultimosRostros.forEach((box, index) => {
      //   const tempCanvas = document.createElement("canvas");
      //   const tempCtx = tempCanvas.getContext("2d");

      //   // const x = Math.max(0, Math.round(box.x));
      //   // const y = Math.max(0, Math.round(box.y));
      //   // const w = Math.round(box.width);
      //   // const h = Math.round(box.height);

      //   const cajaAmpliada = ampliarCajaRostro(box);

      //   const x = cajaAmpliada.x;
      //   const y = cajaAmpliada.y;
      //   const w = cajaAmpliada.width;
      //   const h = cajaAmpliada.height;

      //   tempCanvas.width = w;
      //   tempCanvas.height = h;

      //   tempCtx.drawImage(
      //     video,
      //     x,
      //     y,
      //     w,
      //     h,
      //     0,
      //     0,
      //     w,
      //     h
      //   );

      //   const link = document.createElement("a");
      //   link.href = tempCanvas.toDataURL("image/png");

      //   link.download =
      //     ultimosRostros.length === 1
      //       ? `camdet_${nombreBase}.png`
      //       : `camdet_${nombreBase}_${index + 1}.png`;

      //   document.body.appendChild(link);
      //   link.click();
      //   document.body.removeChild(link);
      // });

      ultimosRostros.forEach((box, index) => {
        const tempCanvas = document.createElement("canvas");
        const tempCtx = tempCanvas.getContext("2d");

        const x = Math.max(0, Math.round(box.x));
        const y = Math.max(0, Math.round(box.y));
        const w = Math.round(box.width);
        const h = Math.round(box.height);

        tempCanvas.width = w;
        tempCanvas.height = h;

        tempCtx.drawImage(
          video,
          x,
          y,
          w,
          h,
          0,
          0,
          w,
          h
        );

        const link = document.createElement("a");
        link.href = tempCanvas.toDataURL("image/png");

        link.download =
          ultimosRostros.length === 1
            ? `camdet_${nombreBase}.png`
            : `camdet_${nombreBase}_${index + 1}.png`;

        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });

      statusText.textContent =
        ultimosRostros.length === 1
          ? "Rostro guardado como PNG."
          : `${ultimosRostros.length} rostros guardados como PNG.`;
    }

    async function cambiarCamara() {
      camaraActual = camaraActual === "user" ? "environment" : "user";

      if (intervalId) {
        clearInterval(intervalId);
        intervalId = null;
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      ultimosRostros = [];
      btnGuardar.style.display = "none";

      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      statusText.textContent =
        camaraActual === "user"
          ? "Cambiando a cámara frontal..."
          : "Cambiando a cámara trasera...";

      await iniciarCamara();
    }

    function detenerCamara() {
      if (intervalId) clearInterval(intervalId);

      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      ultimosRostros = [];
      btnGuardar.style.display = "none";
      video.srcObject = null;
      statusText.textContent = "Cámara detenida.";
    }

    btnStart.addEventListener("click", iniciarCamara);
    btnStop.addEventListener("click", detenerCamara);
    btnGuardar.addEventListener("click", descargarRostrosComoPNG);
    btnCambiarCamara.addEventListener("click", cambiarCamara);
  </script>
</body>
</html>
